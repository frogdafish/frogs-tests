<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"


const supabase = createClient(
  "https://adrusttuicogkeplrcac.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkcnVzdHR1aWNvZ2tlcGxyY2FjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5NDQxMjUsImV4cCI6MjA4NjUyMDEyNX0.XnfYHjY0lR5JMBX855xsOtiC44oOW_bRtZbGmSo8ZB0"
)


let username = localStorage.getItem("username") || ""
let currentChannel = "general"
let isDM = false
let dmUser = null
let typingTimeout = null


if (!username) {
  while (!username) username = prompt("Enter username:")
  localStorage.setItem("username", username)
}


/* ensure profile has owned_snake field too */
await supabase.from("profiles").upsert({
  username,
  bio: "",
  xp: 0,
  level: 1,
  coins: 0,
  owned_snake: false
})


/* ---------------- SEND MESSAGE ---------------- */
async function sendMessage() {
  const input = document.getElementById("messageInput")
  const text = input.value.trim()
  if (!text) return
  if (!isDM && (currentChannel === "stats" || currentChannel === "shop")) {
    alert("You cannot send messages in this channel!")
    return
  }


  const { data: profile, error } = await supabase
    .from("profiles")
    .select('id, can_chat, xp, level, coins, "y they can\'t talk"')
    .eq("username", username)
    .maybeSingle()


  if (error) return console.error(error)
  if (!profile?.can_chat)
    return alert(profile["y they can't talk"] || "You are not allowed to send messages.")


  let insertError = null
  if (isDM) {
    const { error } = await supabase
      .from("dms")
      .insert([{ sender: username, receiver: dmUser, text }])
    insertError = error
    if (error) console.error(error)
  } else {
    const { error } = await supabase
      .from("messages")
      .insert({ channel: currentChannel, username, text })
    insertError = error
    if (error) console.error(error)
  }


  if (!insertError && profile?.id) {
    await supabase.rpc("give_coin_with_cooldown", { uid: profile.id })
    const newXp = profile.xp + 10
    const newLevel = Math.floor(newXp / 100) + 1


    await supabase.from("profiles").update({ xp: newXp }).eq("id", profile.id)
    if (newLevel > profile.level) {
      await supabase.from("profiles").update({ level: newLevel }).eq("id", profile.id)
      displaySystemMessage(`🎉 ${username} leveled up to ${newLevel}!`)
    }
  }


  input.value = ""
  stopTyping()
}


/* ---------------- TYPING ---------------- */
const messageInput = document.getElementById("messageInput")
messageInput.addEventListener("input", async () => {
  const { data: profile } = await supabase
    .from("profiles")
    .select("id")
    .eq("username", username)
    .maybeSingle()
  if (!profile?.id) return
  await supabase.from("typing").upsert({
    user_id: profile.id,
    channel: currentChannel,
    is_dm: isDM,
    dm_user: dmUser
  })
  clearTimeout(typingTimeout)
  typingTimeout = setTimeout(stopTyping, 2000)
})
async function stopTyping() {
  const { data: profile } = await supabase
    .from("profiles")
    .select("id")
    .eq("username", username)
    .maybeSingle()
  if (!profile?.id) return
  await supabase
    .from("typing")
    .delete()
    .eq("user_id", profile.id)
    .eq("channel", currentChannel)
    .eq("is_dm", isDM)
    .eq("dm_user", dmUser)
}


/* ---------------- LOAD ---------------- */
async function loadMessages() {
  const { data } = await supabase
    .from("messages")
    .select("*")
    .eq("channel", currentChannel)
    .order("created_at", { ascending: true })
  const container = document.getElementById("messages")
  container.innerHTML = ""
  data.forEach(displayMessage)
}


async function loadDMs() {
  const { data, error } = await supabase
    .from("dms")
    .select("*")
    .or(
      `and(sender.eq.${encodeURIComponent(
        username
      )},receiver.eq.${encodeURIComponent(
        dmUser
      )}),and(sender.eq.${encodeURIComponent(
        dmUser
      )},receiver.eq.${encodeURIComponent(username)})`
    )
    .order("created_at", { ascending: true })


  if (error) return console.error(error)
  const container = document.getElementById("messages")
  container.innerHTML = ""
  data.forEach((msg) => {
    const div = document.createElement("div")
    div.className = "message"
    div.id = "dm-" + msg.id
    div.innerHTML = `<span class="username">${msg.sender}</span> ${msg.text}`
    container.appendChild(div)
  })
  container.scrollTop = container.scrollHeight
}


async function loadStats() {
  const { data: profile } = await supabase
    .from("profiles")
    .select("username,xp,level,coins,owned_snake")
    .eq("username", username)
    .maybeSingle()
  const container = document.getElementById("messages")
  container.innerHTML = ""
  if (profile) {
    const xpToNext = profile.level * 100 - profile.xp
    const statsDiv = document.createElement("div")
    statsDiv.className = "message"
    statsDiv.innerHTML = `<strong>Username:</strong> ${profile.username}<br>
      <strong>Level:</strong> ${profile.level}<br>
      <strong>XP:</strong> ${profile.xp}<br>
      <strong>XP to next level:</strong> ${xpToNext}<br>
      <strong>Coins:</strong> ${profile.coins}<br>
      <strong>Owns Snake:</strong> ${profile.owned_snake ? "Yes" : "No"}`
    container.appendChild(statsDiv)
  }
  container.scrollTop = container.scrollHeight
}


/* ---------------- FULLSCREEN SNAKE OVERLAY ---------------- */
/* basic full-screen overlay using viewport units for iframe size[web:2] */
function createSnakeOverlay() {
  let overlay = document.getElementById("snake-fullscreen-overlay")
  if (overlay) return overlay


  overlay = document.createElement("div")
  overlay.id = "snake-fullscreen-overlay"
  overlay.style.position = "fixed"
  overlay.style.top = "0"
  overlay.style.left = "0"
  overlay.style.width = "100vw"
  overlay.style.height = "100vh"
  overlay.style.background = "rgba(0, 0, 0, 0.85)"
  overlay.style.display = "flex"
  overlay.style.flexDirection = "column"
  overlay.style.alignItems = "center"
  overlay.style.justifyContent = "center"
  overlay.style.zIndex = "9999"


  const closeBtn = document.createElement("button")
  closeBtn.textContent = "Close"
  closeBtn.style.position = "absolute"
  closeBtn.style.top = "15px"
  closeBtn.style.right = "15px"
  closeBtn.style.padding = "8px 14px"
  closeBtn.style.borderRadius = "4px"
  closeBtn.style.border = "none"
  closeBtn.style.cursor = "pointer"
  closeBtn.style.background = "#7289da"
  closeBtn.style.color = "white"
  closeBtn.onclick = () => {
    document.body.removeChild(overlay)
  }


  const frame = document.createElement("iframe")
  frame.src = "snake.html"
  frame.style.border = "none"
  frame.style.width = "90vw"
  frame.style.height = "90vh"


  overlay.appendChild(closeBtn)
  overlay.appendChild(frame)
  document.body.appendChild(overlay)
  return overlay
}


window.openSnakeFullscreen = function () {
  createSnakeOverlay()
}


/* ---------------- SHOP ---------------- */
async function loadShop() {
  const container = document.getElementById("messages")
  container.innerHTML = ""


  // get current profile for coins and ownership
  const { data: profile } = await supabase
    .from("profiles")
    .select("coins, owned_snake")
    .eq("username", username)
    .maybeSingle()


  const items = [
    {
      name: "Snake Game",
      description: "Play the classic Snake game!",
      cost: 25,
      id: "snake-game"
    },
    {
      name: "Cool Hat",
      description: "Just looks cool.",
      cost: 0
    },
    {
      name: "VIP Badge",
      description: "Shows you are special.",
      cost: 0
    }
  ]


  items.forEach((item) => {
    const div = document.createElement("div")
    div.className = "message"


    if (item.id === "snake-game") {
      let snakeControlsHtml = ""
      if (profile?.owned_snake) {
        // already own snake: show fullscreen play button
        snakeControlsHtml = `
          <button onclick="openSnakeFullscreen()">Play Snake (Fullscreen)</button>`
      } else {
        // do not own snake: show buy button
        snakeControlsHtml = `
          <button onclick="buySnakeGame()">Buy Snake (25 coins)</button>`
      }


      div.innerHTML = `<strong>${item.name}</strong><br>
        ${item.description} Cost: ${item.cost} coins<br>
        ${snakeControlsHtml}
        <div id="snake-container"></div>`
    } else {
      div.innerHTML = `<strong>${item.name}</strong><br>${item.description}`
    }


    container.appendChild(div)
  })


  container.scrollTop = container.scrollHeight
}


async function buySnakeGame() {
  const { data: profile } = await supabase
    .from("profiles")
    .select("coins, owned_snake")
    .eq("username", username)
    .maybeSingle()
  if (!profile) return


  if (profile.owned_snake) {
    alert("You already own Snake!")
    return
  }


  if (profile.coins < 25) {
    alert("You need 25 coins to buy Snake!")
    return
  }


  // charge 25 coins and set owned_snake true
  const { error } = await supabase
    .from("profiles")
    .update({
      coins: profile.coins - 25,
      owned_snake: true
    })
    .eq("username", username)


  if (error) {
    console.error(error)
    alert("Purchase failed, try again.")
    return
  }


  alert("You bought Snake! Opening game...")
  // after buying, immediately open fullscreen
  openSnakeFullscreen()
}


/* ---------------- DISPLAY ---------------- */
function displayMessage(msg) {
  const container = document.getElementById("messages")
  const div = document.createElement("div")
  div.className = "message"
  div.id = "msg-" + msg.id
  div.innerHTML = `<span class="username" onclick="openDM('${msg.username}')">${msg.username}</span> ${msg.text}`
  container.appendChild(div)
  container.scrollTop = container.scrollHeight
}
function displayDMMessage(msg) {
  const container = document.getElementById("messages")
  const div = document.createElement("div")
  div.className = "message"
  div.id = "dm-" + msg.id
  div.innerHTML = `<span class="username">${msg.sender}</span> ${msg.text}`
  container.appendChild(div)
  container.scrollTop = container.scrollHeight
}
function displaySystemMessage(text) {
  const container = document.getElementById("messages")
  const div = document.createElement("div")
  div.className = "message"
  div.style.fontStyle = "italic"
  div.style.color = "#b9bbbe"
  div.innerText = text
  container.appendChild(div)
  container.scrollTop = container.scrollHeight
}


/* ---------------- OPEN DM / SWITCH CHANNEL ---------------- */
window.openDM = async function (user) {
  if (user === username) return
  isDM = true
  dmUser = user
  document.getElementById("channelName").innerText = "@ " + user
  document.getElementById("messageInput").placeholder = "Message @" + user
  await loadDMs()
}
window.switchChannel = async function (channel) {
  isDM = false
  dmUser = null
  currentChannel = channel
  document.getElementById("channelName").innerText =
    channel === "stats" ? "# stats" : channel === "shop" ? "# shop" : "# " + channel
  document.getElementById("messageInput").placeholder =
    channel === "stats" || channel === "shop" ? "" : "Message #" + channel
  if (channel === "stats") {
    await loadStats()
  } else if (channel === "shop") {
    await loadShop()
  } else {
    await loadMessages()
  }
}


/* ---------------- REALTIME ---------------- */
supabase
  .channel("realtime")
  .on(
    "postgres_changes",
    { event: "INSERT", schema: "public", table: "messages" },
    (payload) => {
      if (!isDM && payload.new.channel === currentChannel) displayMessage(payload.new)
    }
  )
  .on(
    "postgres_changes",
    { event: "DELETE", schema: "public", table: "messages" },
    (payload) => {
      const el = document.getElementById("msg-" + payload.old.id)
      if (el) el.remove()
    }
  )
  .subscribe()


supabase
  .channel("dm-realtime")
  .on(
    "postgres_changes",
    { event: "INSERT", schema: "public", table: "dms" },
    (payload) => {
      const msg = payload.new
      if (
        isDM &&
        ((msg.sender === username && msg.receiver === dmUser) ||
          (msg.sender === dmUser && msg.receiver === username))
      )
        displayDMMessage(msg)
    }
  )
  .on(
    "postgres_changes",
    { event: "DELETE", schema: "public", table: "dms" },
    (payload) => {
      const el = document.getElementById("dm-" + payload.old.id)
      if (el) el.remove()
    }
  )
  .subscribe()


/* ---------------- PROFILE EDIT ---------------- */
window.openProfileEditor = async function () {
  const newUsername = prompt("Enter your new username:")
  if (!newUsername) return
  await supabase.from("profiles").update({ username: newUsername }).eq("username", username)
  await supabase.from("messages").update({ username: newUsername }).eq("username", username)
  await supabase.from("dms").update({ sender: newUsername }).eq("sender", username)
  await supabase.from("dms").update({ receiver: newUsername }).eq("receiver", username)
  localStorage.setItem("username", newUsername)
  username = newUsername
  alert("Username updated! Reloading...")
  location.reload()
}


/* ---------------- INITIAL LOAD ---------------- */
loadMessages()
messageInput.addEventListener("keypress", (e) => {
  if (e.key === "Enter") sendMessage()
})


// Prevent arrow keys from scrolling the page
window.addEventListener("keydown", (e) => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
    e.preventDefault()
  }
})
</script>
